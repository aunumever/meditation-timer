appId: com.aunum.meditation-timer
---
# Full navigation: time picker <-> timer <-> settings
- launchApp
- waitForAnimationToEnd

# Start on timer page (center)
- assertVisible:
    text: "10:00"

# Swipe to time picker
- swipe:
    direction: RIGHT
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    text: "hours"

# Swipe back to timer
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    text: "10:00"

# Swipe to settings
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    text: "Session"

# Swipe back to timer
- swipe:
    direction: RIGHT
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    text: "10:00"
