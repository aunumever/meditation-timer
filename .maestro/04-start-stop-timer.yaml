appId: com.aunum.meditation-timer
---
# Start a timer session then stop it
- launchApp
- waitForAnimationToEnd
- assertVisible:
    text: "10:00"

# Tap play button
- tapOn: "Play"

# Wait for timer to start counting down
- extendedWaitUntil:
    notVisible: "10:00"
    timeout: 25000

# Timer is now active — swiping should be blocked
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
# Should still be on timer page, not settings
- assertNotVisible:
    text: "Session"
    optional: true

# Stop the timer
- tapOn: "Stop"
- waitForAnimationToEnd

# Back to ready state
- assertVisible:
    text: "10:00"

# Swiping should work again
- swipe:
    direction: LEFT
    duration: 400
- waitForAnimationToEnd
- assertVisible:
    text: "Session"
